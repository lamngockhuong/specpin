<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="graph.pageTitle">Graph view - Specpin</title>
    <style>
      /* Tokens are imported in main.ts (src/shared/tokens.gen.css); values below
         reference --sp-* vars for light/dark parity, like the other full pages. */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      /* These bars set an author `display`, which overrides the `hidden`
         attribute's UA `display:none` -- so re-assert hidden at id specificity
         (matches the popup/side-panel convention of scoped `[hidden]` rules).
         Without this, toggling `.hidden` in JS would not actually hide them. */
      #capture-banner[hidden], #edit-bar[hidden], #graph-toolbar[hidden] { display: none; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.5 var(--sp-font-ui);
        color: var(--sp-text);
        background: var(--sp-bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--sp-border);
        background: var(--sp-surface);
        flex-wrap: wrap;
      }
      header img { width: 22px; height: 22px; }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header select {
        font: inherit;
        padding: 5px 8px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-border);
        background: var(--sp-control);
        color: var(--sp-text);
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--sp-border);
        background: var(--sp-surface);
        flex-wrap: wrap;
      }
      /* Phase B4: per-project recording banner. While recording it is an
         unmissable error-tinted alarm (shared --sp-error-* tokens) with a reachable
         "Turn off" + "Clear all captured" for this project's draft buffer; when the
         project's record opt-in is OFF it becomes a calm, resting "Turn on" prompt
         (see #capture-banner.off below). */
      #capture-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--sp-error-border);
        background: var(--sp-error-bg);
        color: var(--sp-error-text);
        font-weight: 600;
        flex-wrap: wrap;
      }
      .capture-banner-dot {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        background: var(--sp-error-text);
        animation: rec-pulse 1.6s ease-in-out infinite;
      }
      @keyframes rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      /* Buffer-full state: steady dot (nothing new can be recorded right now,
         so a pulsing "live" dot would be misleading). */
      #capture-banner.full .capture-banner-dot { animation: none; }
      .capture-banner-message { flex: 1; min-width: 220px; }
      .capture-banner-action {
        font: inherit;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-error-border);
        background: var(--sp-surface);
        color: var(--sp-text);
        cursor: pointer;
      }
      .capture-banner-action:hover { background: var(--sp-elevated); }
      /* Off state: record opt-in is a resting, actionable state now (not a live
         alarm), so drop the error tint + pulse -- a "Turn on" prompt must never
         look like an active recording warning. Placed after the base banner rules
         so the higher-specificity overrides read in ascending order. */
      #capture-banner.off {
        border-bottom-color: var(--sp-border);
        background: var(--sp-surface);
        color: var(--sp-text-2);
      }
      #capture-banner.off .capture-banner-dot { background: var(--sp-text-3); animation: none; }
      #capture-banner.off .capture-banner-action { border-color: var(--sp-border); }
      /* Track C: the edit-mode bar -- its own row below the controls (not
         crammed into #controls), accent-edged so "editing" reads at a glance.
         An action-button row plus an info line (static how-to hint + live
         status), so the tools explain themselves. */
      #edit-bar {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--sp-border);
        border-left: 3px solid var(--sp-accent);
        background: var(--sp-elevated);
      }
      .graph-edit-toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .graph-edit-info { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .graph-edit-hint { color: var(--sp-text-2); font-size: 12px; }
      .graph-edit-status { color: var(--sp-accent); font-size: 12px; font-weight: 600; }
      .graph-category-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
      /* Text pill buttons: the category-filter tabs, the Edit-mode toggle, and
         the edit toolbar's text-labelled flow-lifecycle buttons (New/Rename/
         Delete flow). The action buttons in that toolbar are icon-only, hence
         :not(.icon-btn). (The Graph/Table view toggle is icons too -- see the
         shared .icon-btn.) */
      .graph-category-tabs button, .graph-edit-toggle, .graph-edit-toolbar button:not(.icon-btn) {
        font: inherit;
        padding: 5px 10px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-border);
        background: var(--sp-control);
        color: var(--sp-text-2);
        cursor: pointer;
      }
      .graph-edit-toolbar button:not(.icon-btn):hover { background: var(--sp-surface); }
      .graph-category-tabs button.active, .graph-edit-toggle.active {
        background: var(--sp-accent);
        border-color: var(--sp-accent);
        color: var(--sp-accent-on);
      }
      .graph-search {
        font: inherit;
        padding: 5px 10px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-border);
        background: var(--sp-control);
        color: var(--sp-text);
        min-width: 200px;
      }
      main { position: relative; flex: 1; overflow: hidden; }
      #canvas, #table { position: absolute; inset: 0; overflow: auto; }
      /* Floating graph toolbar: the controls that act on the diagram itself
         (layout direction + zoom), pinned to the canvas's free top-left corner
         (#hint is bottom-left, #ghost-panel bottom-right, #edit-form right). */
      #graph-toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: var(--sp-radius-control);
        background: var(--sp-elevated);
        border: 1px solid var(--sp-border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      /* .icon-btn base look + its .active / :disabled states live in the shared
         shared/icon-btn.css (the component's home); only the graph-specific
         grouping/positioning is page-local. */
      .graph-toolbar-group { display: flex; gap: 4px; }
      #canvas svg { display: block; touch-action: none; cursor: grab; }
      #canvas svg:active { cursor: grabbing; }
      .graph-node text, .graph-edge text { pointer-events: none; user-select: none; }
      /* Chip behind an edge label so it stays legible where dagre routes it
         over a line or node. Light like the node boxes (the SVG uses a fixed
         light palette), faintly translucent so the edge shows through. */
      .graph-edge-label-bg { fill: #ffffff; opacity: 0.78; pointer-events: none; }
      .graph-node { cursor: pointer; }
      .graph-node.dimmed, .graph-edge.dimmed { opacity: 0.25; }
      .graph-node.hidden, .graph-edge.hidden { display: none; }
      .graph-node.highlighted rect { stroke-width: 3; }
      .graph-node.has-spec rect { stroke-dasharray: none; }
      /* Phase B3: pending "ghost" nodes/edges from the Track B auto-capture
         draft buffer, not yet approved into screens.json. Committed styling
         above is untouched -- these rules only ever match `.pending`. */
      .graph-node.pending rect { stroke-dasharray: 4 3; fill-opacity: 0.5; }
      .graph-node.pending text { opacity: 0.75; }
      .graph-edge.pending path { stroke-dasharray: 5 4; opacity: 0.8; }
      .graph-edge.pending text { font-style: italic; }
      /* Track C (C1): edit-mode selection, applied only while editing. */
      .graph-node.selected rect { stroke: var(--sp-accent); stroke-width: 3; }
      .graph-edge.selected path { stroke: var(--sp-accent); stroke-width: 2.5; }
      .graph-table { width: 100%; border-collapse: collapse; }
      .graph-table th, .graph-table td {
        text-align: left;
        padding: 6px 12px;
        border-bottom: 1px solid var(--sp-border);
      }
      .graph-table tbody tr { cursor: pointer; }
      .graph-table tbody tr:hover { background: var(--sp-control); }
      .graph-table-spec { color: var(--sp-text-2); font-family: var(--sp-font-mono); font-size: 11px; }
      .graph-table-empty, .graph-empty { padding: 24px; color: var(--sp-text-2); }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 16px;
        right: 16px;
        max-width: 480px;
        padding: 10px 14px;
        border-radius: var(--sp-radius-control);
        background: var(--sp-elevated);
        border: 1px solid var(--sp-border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        display: none;
      }
      #hint.visible { display: block; }
      /* Phase B3: inline Approve/Discard review for a clicked ghost edge.
         Fixed panel like #hint, opposite corner so the two never overlap. */
      #ghost-panel {
        position: absolute;
        bottom: 16px;
        right: 16px;
        max-width: 320px;
        padding: 12px 14px;
        border-radius: var(--sp-radius-control);
        background: var(--sp-elevated);
        border: 1px solid var(--sp-border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      .ghost-panel-label { font-weight: 600; margin-bottom: 2px; }
      .ghost-panel-note { color: var(--sp-text-2); font-size: 12px; margin-bottom: 8px; }
      .ghost-panel-error { color: var(--sp-error-text); font-size: 12px; margin-bottom: 8px; }
      .ghost-panel-actions { display: flex; gap: 8px; }
      .ghost-panel-actions button {
        font: inherit;
        padding: 5px 12px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-border);
        background: var(--sp-control);
        color: var(--sp-text);
        cursor: pointer;
      }
      .ghost-panel-actions button:first-child {
        background: var(--sp-accent);
        border-color: var(--sp-accent);
        color: var(--sp-accent-on);
      }
      .ghost-panel-actions button:disabled { opacity: 0.6; cursor: default; }
      /* Track C (C2): the field-edit / create-flow side form. A right-side
         panel (unlike #ghost-panel/#hint's fixed corner boxes) since it holds
         several rows of fields and can grow tall with locales. */
      #edit-form {
        position: absolute;
        top: 12px;
        right: 16px;
        bottom: 16px;
        width: 320px;
        max-width: calc(100% - 32px);
        overflow-y: auto;
        padding: 12px 14px;
        border-radius: var(--sp-radius-control);
        background: var(--sp-elevated);
        border: 1px solid var(--sp-border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      .edit-form-title { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
      .edit-form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
      .edit-form-row label { color: var(--sp-text-2); font-size: 11px; }
      .edit-form-row input, .edit-form-row select, .edit-form-specid-select, .edit-form-specid-filter {
        font: inherit;
        padding: 5px 8px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-border);
        background: var(--sp-control);
        color: var(--sp-text);
      }
      .edit-form-specid-filter { margin-bottom: 4px; }
      .edit-form-locale-rows { display: flex; flex-direction: column; gap: 6px; }
      .edit-form-locale-row { display: flex; align-items: center; gap: 6px; }
      .edit-form-locale-label {
        min-width: 28px;
        font-size: 11px;
        color: var(--sp-text-2);
        text-transform: uppercase;
      }
      .edit-form-locale-row input { flex: 1; }
      .edit-form-remove-locale, .edit-form-add-locale {
        font: inherit;
        border: 1px solid var(--sp-border);
        background: var(--sp-control);
        color: var(--sp-text-2);
        border-radius: var(--sp-radius-control);
        cursor: pointer;
      }
      .edit-form-remove-locale { padding: 2px 8px; }
      .edit-form-add-locale { margin-top: 6px; padding: 4px 10px; align-self: flex-start; }
      .edit-form-field-error, .edit-form-error {
        color: var(--sp-error-text);
        font-size: 11px;
        margin-top: 4px;
      }
      .edit-form-notice {
        color: var(--sp-text-2);
        font-size: 11px;
        margin-bottom: 10px;
      }
      .edit-form-submit {
        font: inherit;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: var(--sp-radius-control);
        border: 1px solid var(--sp-accent);
        background: var(--sp-accent);
        color: var(--sp-accent-on);
        cursor: pointer;
      }
      .edit-form-submit:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <img src="/icon/32.png" alt="" />
      <h1 data-i18n="graph.pageTitle">Graph view</h1>
      <select id="project-select" hidden></select>
      <select id="dataset-select" hidden>
        <option value="flows" data-i18n="graph.datasetFlows">Flows</option>
        <option value="screens" data-i18n="graph.datasetScreens">Screens</option>
      </select>
    </header>
    <div id="controls"></div>
    <div id="capture-banner" hidden></div>
    <div id="edit-bar" hidden></div>
    <main>
      <div id="canvas"></div>
      <div id="graph-toolbar" hidden></div>
      <div id="table" hidden></div>
      <div id="hint"></div>
      <div id="ghost-panel" hidden></div>
      <div id="edit-form" hidden></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
